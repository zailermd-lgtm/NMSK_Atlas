<div id="xsp-panel" class="xsp" hidden role="group" aria-label="Slices of one part">
  <div class="xsp-head"><b>Slices</b><select id="xsp-part" aria-label="The part to slice"><option value="">Choose a part&hellip;</option></select><button type="button" id="xsp-close" aria-label="Close the slices panel" title="Close">&times;</button></div>
  <div class="xsp-row"><span class="xsp-l">Thick</span><span class="xsp-seg" id="xsp-th"><button type="button" data-xth="0" aria-pressed="false" title="Zero-thickness planes">0</button><button type="button" data-xth="0.5" aria-pressed="false">0.5</button><button type="button" data-xth="1" aria-pressed="true">1</button><button type="button" data-xth="2" aria-pressed="false">2</button><button type="button" data-xth="5" aria-pressed="false">5 mm</button></span></div>
  <div class="xsp-row"><span class="xsp-l">Every</span><span class="xsp-seg" id="xsp-int"><button type="button" data-xint="2" aria-pressed="false">2</button><button type="button" data-xint="5" aria-pressed="false">5</button><button type="button" data-xint="10" aria-pressed="true">10</button><button type="button" data-xint="20" aria-pressed="false">20 mm</button></span><input id="xsp-intv" type="number" min="0.5" max="200" step="0.5" value="10" aria-label="Interval between slices along the part, mm"></div>
  <div class="xsp-row"><span class="xsp-l">Spread</span><span class="xsp-seg" id="xsp-gap" title="Display only: draws the slices apart so they do not hide each other; their true positions do not change"><button type="button" data-xgap="1" aria-pressed="true">&times;1</button><button type="button" data-xgap="2" aria-pressed="false">&times;2</button><button type="button" data-xgap="3" aria-pressed="false">&times;3</button><button type="button" data-xgap="5" aria-pressed="false">&times;5</button></span></div>
  <div class="xsp-row"><button type="button" id="xsp-scope" aria-pressed="false" title="Cut only the part's own structures, or every shown structure around it (skin, tendons, vessels...)">Everything around it</button><button type="button" id="xsp-frame" title="Turn the camera to the stack">Frame</button><button type="button" id="xsp-off" title="Remove the slices" disabled>Off</button></div>
  <p class="nmsk-tip">The slices are perpendicular to the part's own long axis, from one end to the other. Spread only moves them apart on screen; the positions listed and measured stay the true ones.</p>
  <p id="xsp-info" class="xsp-info" aria-live="polite"></p>
</div>
