<div id="cut-panel" hidden role="group" aria-label="Cut mode">
  <div class="cp-head"><b>Cut</b><span id="cut-state" class="cp-dim"></span><span class="cp-sp"></span><button type="button" id="cut-min" aria-expanded="true" aria-label="Collapse or expand the cut panel" title="Collapse / expand">&#9662;</button><button type="button" id="cut-exit" title="Leave cut mode and show the whole model again">exit cut</button></div>
  <div class="cp-body">
    <div class="cp-lbl">Plane</div>
    <div class="cp-row" id="cut-axis">
      <button type="button" data-axis="x" aria-pressed="true" title="Plane normal along the body's left-right axis">sagittal</button><button type="button" data-axis="y" aria-pressed="false" title="Plane normal along the head-to-foot axis">axial</button><button type="button" data-axis="z" aria-pressed="false" title="Plane normal along the front-to-back axis">coronal</button><button type="button" data-axis="view" aria-pressed="false" title="A plane facing the camera, using the view direction at the moment you press it">facing me</button>
    </div>
    <div class="cp-row"><button type="button" id="cut-place" aria-pressed="false" title="Then click or tap the model: the plane passes through that point">Place on model</button><button type="button" id="cut-reset" title="Back to the default sagittal plane through the middle, default side">reset cut</button></div>
    <p id="cut-hint" class="cp-hint" aria-live="polite"></p>
    <div class="cp-lbl">Removed side</div>
    <div class="cp-row" id="cut-side">
      <button type="button" id="cut-side-a" data-rs="1" aria-pressed="false"></button><button type="button" id="cut-side-b" data-rs="-1" aria-pressed="false"></button><button type="button" id="cut-flip" aria-pressed="false" title="Remove the other side">flip side</button>
    </div>
    <div class="cp-lbl">Move plane <output id="cut-mm" for="cut-pos">0.0 mm</output></div>
    <input id="cut-pos" type="range" min="-100" max="100" step="0.5" value="0" aria-label="Move the cut plane along its normal (millimetres)">
    <div class="cp-row cp-steps" id="cut-steps">
      <button type="button" data-step="-10">&minus;10</button><button type="button" data-step="-1">&minus;1</button><button type="button" data-step="1">+1</button><button type="button" data-step="10">+10</button>
    </div>
    <p class="cp-hint cp-keys">Keys: arrows &plusmn;1 mm, with Shift or PageUp/PageDown &plusmn;10 mm. Mouse wheel over the slider also moves the plane.</p>
  </div>
</div>
