<div id="pose-panel" role="dialog" aria-label="Pose controls" hidden>
  <div class="pz-head"><b id="pz-title">Pose</b><span id="pz-tile-name" class="pz-tname"></span><span class="pz-hsp"></span><button type="button" id="pz-rings-btn" class="pz-mini" aria-pressed="false" title="Show the rotation rings on whichever joint the pointer is over, and turn the joint by dragging one of them. Click a joint (or start turning it) to hold it: its rings stay until you click the joint again or press Esc. They stay on when this panel is closed.">Rings on the model</button><button type="button" id="pz-solo" class="pz-mini" aria-pressed="false" title="Show only the joint the pointer is over, or the joint that is held: its sliders and nothing else. Press again for the whole list.">This joint only</button><button type="button" id="pz-min" aria-expanded="true" aria-label="Shrink the pose panel to a small tile; Pose stays on" title="Shrink to a small tile. Pose stays on and the pose is kept; press the tile to open the panel again.">&#8211;</button><button type="button" id="pz-close" aria-label="Close the pose panel">&times;</button></div>
  <div class="pz-badge" role="note"><b>Pose preview:</b> kinematic approximation, soft tissue not simulated (no collision / volume preservation). Normal ranges are population averages.</div>
  <div id="pz-body" class="pz-body"></div>
  <div id="pz-status" class="pz-status" aria-live="polite"></div>
</div>
<div id="pose-banner" role="status" aria-live="polite" hidden><b>Pose preview</b><span class="pz-btxt">kinematic approximation, soft tissue not simulated; not measured anatomy</span><button type="button" id="pose-banner-open">Pose</button><button type="button" id="pose-banner-reset">Reset</button></div>
