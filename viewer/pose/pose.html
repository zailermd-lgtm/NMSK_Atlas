  <div class="pz-head"><b>Pose</b><span class="pz-hsp"></span><button type="button" id="pz-rings-btn" class="pz-mini" aria-pressed="false" title="Show the three rotation rings on whichever joint the pointer is over, and turn the joint by dragging one of them. They stay on when this panel is closed.">Rings on the model</button><button type="button" id="pz-close" aria-label="Close the pose panel">&times;</button></div>
