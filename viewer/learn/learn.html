<div id="ln-panel" hidden role="group" aria-label="Learn">
  <div class="ln-head"><b>Learn</b><span class="ln-sp"></span><button type="button" id="ln-close" aria-label="Close the learn panel" title="Close">&times;</button></div>
  <div class="ln-body">
    <input id="ln-q" type="search" placeholder="Search a muscle, a group or a motion (e.g. hip flexion)" autocomplete="off" aria-label="Search a muscle, a muscle group or a motion">
    <label class="ln-chk"><input type="checkbox" id="ln-follow" checked> Or click a muscle on the model</label>
    <div class="ln-res" id="ln-res"></div>
    <div id="ln-card" class="ln-card" hidden>
      <p class="ln-title" id="ln-title"></p>
      <div class="ln-chips" id="ln-parts"></div>
      <div class="ln-lbl">Display</div>
      <div class="ln-row"><span class="ln-dim">Others</span><input type="range" id="ln-op" min="0" max="100" step="1" value="25" aria-label="Opacity of everything else, in percent"><span class="ln-mono" id="ln-op-v">25%</span><button type="button" id="ln-showall" title="Clear the highlight and show everything normally again">Show all</button></div>
      <div class="ln-lbl">Rotate the figure</div>
      <div class="ln-row" id="ln-rot">
        <button type="button" data-turn="180" data-dir="-1" title="Half turn, counter-clockwise seen from above">&#189; &#10226;</button><button type="button" data-turn="180" data-dir="1" title="Half turn, clockwise seen from above">&#189; &#10227;</button><button type="button" data-turn="360" data-dir="-1" title="Full turn, counter-clockwise seen from above">1 &#10226;</button><button type="button" data-turn="360" data-dir="1" title="Full turn, clockwise seen from above">1 &#10227;</button>
      </div>
      <div class="ln-lbl">Simulate its action</div>
      <div id="ln-acts" class="ln-acts"></div>
      <p id="ln-act-msg" class="ln-hint" aria-live="polite"></p>
      <details class="ln-info" id="ln-info-wrap" open><summary>About it (cited)</summary><div id="ln-info"></div></details>
    </div>
    <p id="ln-msg" class="ln-hint" aria-live="polite"></p>
  </div>
</div>
